<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Sahifa topilmadi — Yangi o'zbek alifbosi</title>
<style>
  :root{--ink:#121828;--muted:#6b7383;--brand:#3b6ce8;--line:#e7e9ee;--surface:#fff}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;line-height:1.6;color:var(--ink);background:#f6f7f9;
  }
  .box{
    max-width:520px;width:100%;text-align:center;background:var(--surface);
    border:1px solid var(--line);border-radius:16px;padding:44px 32px;
    box-shadow:0 1px 2px rgba(18,24,40,.06),0 14px 34px rgba(18,24,40,.05);
  }
  .code{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
  h1{font-size:clamp(24px,4vw,32px);line-height:1.2;letter-spacing:-.02em;margin:10px 0 10px}
  p{margin:0 0 24px;color:var(--muted);font-size:15px}
  a{
    display:inline-block;font-size:15px;font-weight:550;text-decoration:none;
    color:#fff;background:var(--brand);padding:11px 20px;border-radius:10px;
  }
  a:focus-visible{outline:3px solid #121828;outline-offset:2px}
</style>
</head>
<body>
  <main class="box">
    <div class="code">404</div>
    <h1>Sahifa topilmadi</h1>
    <p>Bu manzil mavjud emas yoki ko'chirilgan. Konvertorga qaytib, matn yoki faylni o'girishda davom eting.</p>
    <a href="/">Konvertorga qaytish</a>
  </main>
</body>
</html>
